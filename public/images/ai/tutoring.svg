<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <defs>
    <linearGradient id="tu-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE4D0"/>
      <stop offset="1" stop-color="#E3D3B5"/>
    </linearGradient>
    <linearGradient id="tu-board" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5E8C6A"/>
      <stop offset="1" stop-color="#3F6B4E"/>
    </linearGradient>
    <linearGradient id="tu-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A67F38"/>
      <stop offset="1" stop-color="#7A5A2B"/>
    </linearGradient>
    <linearGradient id="tu-cream" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F1E6D0"/>
    </linearGradient>
    <linearGradient id="tu-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDBB77"/>
      <stop offset="1" stop-color="#A67F38"/>
    </linearGradient>
    <linearGradient id="tu-visor" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#9DBEA6"/>
      <stop offset="1" stop-color="#5E8C6A"/>
    </linearGradient>
    <radialGradient id="tu-glow">
      <stop offset="0" stop-color="#F2FBF6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F2FBF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tu-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78A583"/>
      <stop offset="1" stop-color="#4E7D5B"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <circle cx="300" cy="230" r="196" fill="#F7F0E3"/>
  <circle cx="500" cy="180" r="92" fill="#F4E3B8" opacity="0.7"/>
  <g fill="#D9BE8C">
    <path d="M78 150 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
    <path d="M596 110 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5z"/>
  </g>

  <!-- ground -->
  <path d="M86 402 C92 372 180 362 320 362 C470 362 560 370 566 398 C572 424 470 436 320 436 C170 436 80 428 86 402Z" fill="url(#tu-ground)"/>
  <ellipse cx="226" cy="394" rx="124" ry="10" fill="#3A3024" opacity="0.08"/>

  <!-- easel board -->
  <g>
    <g stroke="url(#tu-wood)" stroke-width="10" stroke-linecap="round">
      <path d="M146 290 L130 394"/>
      <path d="M306 290 L322 394"/>
    </g>
    <rect x="92" y="106" width="268" height="192" rx="16" fill="url(#tu-wood)"/>
    <rect x="104" y="118" width="244" height="168" rx="10" fill="url(#tu-board)"/>
    <path d="M104 172 L150 118 H178 L104 204Z" fill="#FFFFFF" opacity="0.06"/>
    <rect x="96" y="294" width="260" height="12" rx="6" fill="#7A5A2B"/>
    <rect x="276" y="286" width="30" height="10" rx="5" fill="#FFFDF9"/>
    <!-- diagram -->
    <circle cx="164" cy="172" r="25" fill="#F7F0E3"/>
    <circle cx="158" cy="166" r="9" fill="#FFFFFF" opacity="0.8"/>
    <path d="M292 142 L320 192 H264Z" fill="#D9BE8C" stroke="#D9BE8C" stroke-width="6" stroke-linejoin="round"/>
    <rect x="202" y="222" width="44" height="44" rx="8" fill="#E39B7B"/>
    <g stroke="#FFFDF9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M196 160 C216 146 238 146 254 156"/>
      <path d="M245 148 L256 157 L243 162"/>
      <path d="M284 206 C278 222 268 232 256 238"/>
      <path d="M258 226 L254 239 L267 241"/>
      <path d="M196 244 C176 240 164 226 162 206"/>
      <path d="M154 214 L162 204 L170 213"/>
    </g>
  </g>

  <!-- books (foreground) -->
  <g>
    <ellipse cx="146" cy="424" rx="46" ry="7" fill="#3A3024" opacity="0.1"/>
    <rect x="106" y="400" width="82" height="20" rx="5" fill="#9DBEA6"/>
    <rect x="112" y="404" width="72" height="12" rx="3" fill="#FFFDF9"/>
    <rect x="114" y="380" width="68" height="20" rx="5" fill="#C9A45C"/>
    <rect x="120" y="384" width="58" height="12" rx="3" fill="#F7F0E3"/>
    <path d="M162 380 V370 l5 4 5 -4 V380" fill="#E39B7B"/>
  </g>

  <!-- robot -->
  <g transform="translate(482 318) scale(0.72)">
    <ellipse cx="0" cy="110" rx="62" ry="10" fill="#3A3024" opacity="0.12"/>
    <!-- pointing arm + pointer -->
    <g transform="translate(-54 4) rotate(135)">
      <path d="M0 50 L0 222" stroke="#7A5A2B" stroke-width="5" stroke-linecap="round"/>
      <circle cx="0" cy="224" r="6.5" fill="#C9A45C"/>
      <rect x="-14" y="0" width="28" height="60" rx="14" fill="url(#tu-cream)" stroke="#E3D3B5" stroke-width="2.5"/>
      <circle cx="0" cy="58" r="12" fill="#EFE4D0" stroke="#E3D3B5" stroke-width="2.5"/>
    </g>
    <g transform="translate(54 4) rotate(-24)">
      <rect x="-14" y="0" width="28" height="60" rx="14" fill="url(#tu-cream)" stroke="#E3D3B5" stroke-width="2.5"/>
      <circle cx="0" cy="58" r="12" fill="#EFE4D0" stroke="#E3D3B5" stroke-width="2.5"/>
    </g>
    <!-- body -->
    <rect x="-56" y="-16" width="112" height="100" rx="46" fill="url(#tu-cream)" stroke="#E3D3B5" stroke-width="2.5"/>
    <circle cx="0" cy="28" r="16" fill="url(#tu-gold)"/>
    <circle cx="0" cy="28" r="11" fill="url(#tu-visor)"/>
    <circle cx="-3" cy="25" r="4" fill="#F2FBF6"/>
    <rect x="-34" y="-26" width="68" height="16" rx="8" fill="url(#tu-gold)"/>
    <!-- antenna -->
    <path d="M0 -150 C0 -166 3 -174 8 -182" stroke="#7A5A2B" stroke-width="5" stroke-linecap="round"/>
    <path d="M8 -182 C20 -212 54 -222 82 -200 Q74 -196 72 -184 Q68 -193 61 -197 Q55 -190 53 -178 Q49 -189 42 -194 Q36 -184 33 -171 Q29 -184 22 -189 Q14 -184 8 -182Z" fill="url(#tu-leaf)"/>
    <path d="M11 -185 C30 -202 54 -208 78 -200" stroke="#3F6B4E" stroke-width="2" stroke-linecap="round"/>
    <!-- head (looking toward the board) -->
    <circle cx="-80" cy="-86" r="13" fill="url(#tu-gold)"/>
    <circle cx="80" cy="-86" r="13" fill="url(#tu-gold)"/>
    <rect x="-80" y="-150" width="160" height="128" rx="60" fill="url(#tu-cream)" stroke="#E3D3B5" stroke-width="2.5"/>
    <ellipse cx="-46" cy="-132" rx="18" ry="8" transform="rotate(-24 -46 -132)" fill="#FFFFFF" opacity="0.9"/>
    <rect x="-64" y="-130" width="128" height="88" rx="44" fill="url(#tu-gold)"/>
    <rect x="-58" y="-124" width="116" height="76" rx="38" fill="url(#tu-visor)"/>
    <path d="M-44 -108 C-38 -116 -28 -119 -16 -119" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
    <circle cx="-32" cy="-90" r="20" fill="url(#tu-glow)"/>
    <circle cx="16" cy="-90" r="20" fill="url(#tu-glow)"/>
    <ellipse cx="-32" cy="-90" rx="8" ry="10" fill="#F2FBF6"/>
    <ellipse cx="16" cy="-90" rx="8" ry="10" fill="#F2FBF6"/>
    <path d="M-20 -68 Q-8 -59 4 -68" stroke="#F2FBF6" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
