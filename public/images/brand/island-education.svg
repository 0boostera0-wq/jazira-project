<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="edu-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE3E4"/>
      <stop offset="1" stop-color="#A9CBCF"/>
    </linearGradient>
    <linearGradient id="edu-sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFE4D0"/>
      <stop offset="1" stop-color="#E3D3B5"/>
    </linearGradient>
    <linearGradient id="edu-sandside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3D3B5"/>
      <stop offset="1" stop-color="#D9BE8C"/>
    </linearGradient>
    <linearGradient id="edu-grass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E8C6A"/>
      <stop offset="1" stop-color="#3F6B4E"/>
    </linearGradient>
    <linearGradient id="edu-wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#EFE4D0"/>
    </linearGradient>
    <linearGradient id="edu-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3D3B5"/>
      <stop offset="1" stop-color="#EFE4D0"/>
    </linearGradient>
    <linearGradient id="edu-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A45C"/>
      <stop offset="1" stop-color="#A67F38"/>
    </linearGradient>
    <linearGradient id="edu-champ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3D3B5"/>
      <stop offset="1" stop-color="#D9BE8C"/>
    </linearGradient>
    <linearGradient id="edu-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F1E6D0"/>
    </linearGradient>
    <linearGradient id="edu-trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A67F38"/>
      <stop offset="1" stop-color="#7A5A2B"/>
    </linearGradient>
    <linearGradient id="edu-coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBB096"/>
      <stop offset="1" stop-color="#E39B7B"/>
    </linearGradient>
  </defs>

  <!-- background: morning sky halo, low sun, cloud -->
  <g id="background">
    <circle cx="410" cy="290" r="250" fill="#EAF2F1"/>
    <circle cx="232" cy="160" r="54" fill="#F4E3B8"/>
    <path d="M548 132h118a22 22 0 0 0-20-32 32 32 0 0 0-60-6 24 24 0 0 0-38 38z" fill="#FFFDF9"/>
    <path d="M318 196l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#D9BE8C"/>
    <path d="M700 300l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#D9BE8C"/>
  </g>

  <!-- water and island -->
  <g id="island">
    <path d="M86 472c0-42 140-72 314-72s314 30 314 72-140 74-314 74S86 514 86 472z" fill="url(#edu-water)"/>
    <path d="M150 510c12-5 24-5 36 0M602 520c12-5 24-5 36 0M660 480c10-4 20-4 30 0" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <ellipse cx="410" cy="476" rx="250" ry="30" fill="#3A3024" opacity="0.1"/>
    <path d="M156 452c0-40 112-66 254-66s254 26 254 66c0 32-112 50-254 50S156 484 156 452z" fill="url(#edu-sandside)"/>
    <ellipse cx="410" cy="440" rx="254" ry="56" fill="url(#edu-sand)"/>
    <path d="M166 458c34 26 130 38 244 38s212-12 246-38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <path d="M196 428c0-30 96-52 214-52s214 22 214 52c0 12-18 14-30 12-14 9-40 8-52 1-24 9-58 10-80 4-28 9-64 9-88 0-22 8-52 6-64-5-18 3-42 0-48-6-24 0-36-2-36-10z" fill="url(#edu-grass)"/>
  </g>

  <!-- stepping stones -->
  <g id="stones">
    <ellipse cx="236" cy="526" rx="22" ry="8" fill="#D9BE8C"/>
    <ellipse cx="236" cy="522" rx="22" ry="8" fill="#EFE4D0"/>
    <ellipse cx="276" cy="502" rx="20" ry="7.5" fill="#D9BE8C"/>
    <ellipse cx="276" cy="498" rx="20" ry="7.5" fill="#EFE4D0"/>
    <ellipse cx="316" cy="480" rx="19" ry="7" fill="#D9BE8C"/>
    <ellipse cx="316" cy="476" rx="19" ry="7" fill="#FFFDF9"/>
    <ellipse cx="354" cy="458" rx="17" ry="6.5" fill="#D9BE8C"/>
    <ellipse cx="354" cy="455" rx="17" ry="6.5" fill="#FFFDF9"/>
    <ellipse cx="392" cy="440" rx="16" ry="6" fill="#D9BE8C"/>
    <ellipse cx="392" cy="437" rx="16" ry="6" fill="#FFFDF9"/>
    <ellipse cx="428" cy="425" rx="15" ry="5.5" fill="#D9BE8C"/>
    <ellipse cx="428" cy="422" rx="15" ry="5.5" fill="#FFFDF9"/>
  </g>

  <!-- book terraces with flag -->
  <g id="books">
    <rect x="170" y="386" width="140" height="36" rx="10" fill="url(#edu-grass)"/>
    <rect x="184" y="393" width="120" height="22" rx="4" fill="url(#edu-page)"/>
    <path d="M190 401h108M190 408h108" stroke="#E3D3B5" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M166 390c0-5 4-8 9-8h130c5 0 9 3 9 8 0 5-6 6-10 6-5 0-6 5-11 5s-7-4-12-4-7 5-12 5-7-5-12-5H178c-6 0-12 1-12-7z" fill="#5E8C6A"/>
    <rect x="180" y="354" width="112" height="34" rx="10" fill="url(#edu-champ)"/>
    <path d="M200 358v26M272 358v26" stroke="#A67F38" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M176 358c0-5 4-8 9-8h102c5 0 9 3 9 8 0 5-6 6-10 6-5 0-6 5-11 5s-6-4-11-4-7 4-12 4-6-4-11-4H188c-6 0-12 1-12-7z" fill="url(#edu-grass)"/>
    <rect x="194" y="326" width="88" height="30" rx="9" fill="url(#edu-gold)"/>
    <rect x="206" y="332" width="70" height="18" rx="4" fill="url(#edu-page)"/>
    <path d="M212 341h58" stroke="#E3D3B5" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M190 330c0-5 4-8 9-8h78c5 0 9 3 9 8 0 5-6 6-10 6-5 0-6 4-11 4s-6-4-11-4H202c-6 0-12 1-12-6z" fill="#5E8C6A"/>
    <path d="M238 324v-66" stroke="#7A5A2B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="238" cy="256" r="4" fill="#C9A45C"/>
    <path d="M240 262c14-4 26 4 42 0v28c-16 4-28-4-42 0z" fill="url(#edu-coral)"/>
    <circle cx="176" cy="414" r="13" fill="url(#edu-grass)"/>
    <circle cx="302" cy="380" r="10" fill="url(#edu-grass)"/>
  </g>

  <!-- open-air pavilion -->
  <g id="pavilion">
    <ellipse cx="458" cy="420" rx="128" ry="10" fill="#3A3024" opacity="0.1"/>
    <rect x="336" y="400" width="244" height="18" rx="6" fill="url(#edu-champ)"/>
    <rect x="348" y="390" width="220" height="14" rx="5" fill="url(#edu-sand)"/>
    <path d="M360 390V300h196v90z" fill="url(#edu-wall)"/>
    <path d="M375 390v-44a23 23 0 0 1 46 0v44zM435 390v-44a23 23 0 0 1 46 0v44zM495 390v-44a23 23 0 0 1 46 0v44z" fill="url(#edu-inner)"/>
    <rect x="444" y="340" width="28" height="20" rx="3" fill="#3F6B4E"/>
    <path d="M450 350h10" stroke="#9DBEA6" stroke-width="2" stroke-linecap="round"/>
    <path d="M375 346a23 23 0 0 1 46 0M435 346a23 23 0 0 1 46 0M495 346a23 23 0 0 1 46 0" stroke="#C9A45C" stroke-width="2" stroke-linecap="round"/>
    <rect x="346" y="288" width="224" height="16" rx="6" fill="url(#edu-gold)"/>
    <rect x="356" y="276" width="204" height="14" rx="5" fill="url(#edu-wall)"/>
    <path d="M428 276c0-18 14-30 30-30s30 12 30 30z" fill="url(#edu-grass)"/>
    <path d="M440 266c2-7 7-12 13-14" stroke="#9DBEA6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="458" cy="242" r="4" fill="#C9A45C"/>
    <circle cx="352" cy="410" r="12" fill="url(#edu-grass)"/>
    <circle cx="366" cy="414" r="8" fill="#5E8C6A"/>
  </g>

  <!-- palm -->
  <g id="palm" transform="translate(600 432) scale(0.95)">
    <path d="M-9 0C-8-70 2-140 22-205l14 4C18-140 10-70 11 0z" fill="url(#edu-trunk)"/>
    <path d="M-7-40q9 5 18 0M-5-82q9 5 18 0M0-124q9 5 17 0M8-164q8 5 16 0" stroke="#7A5A2B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M29-207c-19-38-59-55-89-43 35 6 65 22 85 50zM29-207c21-43 66-55 91-38-32 3-65 19-87 45z" fill="#3F6B4E"/>
    <path d="M29-205c-29-20-79-17-111 27 34-22 72-24 111-20zM29-205c31-23 81-17 111 25-35-22-72-24-111-18z" fill="url(#edu-grass)"/>
    <path d="M29-203c-24 3-54 23-64 53 20-25 43-40 64-48zM29-203c26 5 56 25 66 58-20-27-43-43-66-53z" fill="#5E8C6A"/>
    <circle cx="22" cy="-196" r="7" fill="#7A5A2B"/>
    <circle cx="36" cy="-194" r="7" fill="#A67F38"/>
  </g>

  <!-- foreground -->
  <g id="foreground">
    <path d="M646 446c1-10 5-16 10-21M653 448c0-8 2-13 5-16M660 448c1-6 4-10 8-12" stroke="#5E8C6A" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="186" cy="470" rx="14" ry="7" fill="url(#edu-champ)"/>
  </g>
</svg>
