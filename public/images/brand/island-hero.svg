<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" fill="none">
  <defs>
    <linearGradient id="hero-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F0E3"/>
      <stop offset="1" stop-color="#F4E3B8"/>
    </linearGradient>
    <linearGradient id="hero-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE3E4"/>
      <stop offset="1" stop-color="#A9CBCF"/>
    </linearGradient>
    <linearGradient id="hero-sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFE4D0"/>
      <stop offset="1" stop-color="#E3D3B5"/>
    </linearGradient>
    <linearGradient id="hero-sandside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3D3B5"/>
      <stop offset="1" stop-color="#D9BE8C"/>
    </linearGradient>
    <linearGradient id="hero-grass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E8C6A"/>
      <stop offset="1" stop-color="#3F6B4E"/>
    </linearGradient>
    <linearGradient id="hero-hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B4CFBB"/>
      <stop offset="1" stop-color="#9DBEA6"/>
    </linearGradient>
    <linearGradient id="hero-trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A67F38"/>
      <stop offset="1" stop-color="#7A5A2B"/>
    </linearGradient>
    <linearGradient id="hero-tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#EFE4D0"/>
    </linearGradient>
    <linearGradient id="hero-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A45C"/>
      <stop offset="1" stop-color="#A67F38"/>
    </linearGradient>
    <linearGradient id="hero-champ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3D3B5"/>
      <stop offset="1" stop-color="#D9BE8C"/>
    </linearGradient>
    <linearGradient id="hero-coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBB096"/>
      <stop offset="1" stop-color="#E39B7B"/>
    </linearGradient>
    <linearGradient id="hero-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F1E6D0"/>
    </linearGradient>
    <filter id="hero-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- background: soft halo, sun, clouds -->
  <g id="background">
    <circle cx="600" cy="520" r="390" fill="#F7F0E3"/>
    <circle cx="350" cy="300" r="118" fill="url(#hero-sun)"/>
    <path d="M300 350h176a34 34 0 0 0-30-50 44 44 0 0 0-82-8 30 30 0 0 0-64 58z" fill="#FFFDF9"/>
    <path d="M806 222h170a30 30 0 0 0-26-44 48 48 0 0 0-90-10 34 34 0 0 0-54 54z" fill="#FFFDF9"/>
    <path d="M834 222h110" stroke="#EFE4D0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- water -->
  <g id="water">
    <path d="M140 792c0-60 190-104 460-104s470 44 470 104-190 108-470 108-460-46-460-108z" fill="url(#hero-water)"/>
    <path d="M196 792h70M222 808h52M186 824h40" stroke="#F4E3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M290 862c14-6 28-6 42 0M962 838c18-8 36-8 54 0M858 870c14-6 28-6 42 0M1004 774c12-5 24-5 36 0" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <ellipse cx="600" cy="794" rx="330" ry="44" fill="#3A3024" opacity="0.1"/>
  </g>

  <!-- island base -->
  <g id="island">
    <path d="M292 742c0-52 138-92 308-92s310 40 310 92c0 44-134 70-310 70S292 786 292 742z" fill="url(#hero-sandside)"/>
    <ellipse cx="601" cy="728" rx="306" ry="80" fill="url(#hero-sand)"/>
    <path d="M304 752c40 38 158 56 296 56s258-18 298-56" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <!-- sage hill behind the books -->
    <path d="M364 706c0-60 30-104 70-128 16-52 54-86 96-100 20-42 46-62 76-62s58 22 76 64c42 14 76 50 90 100 42 24 70 70 70 126z" fill="url(#hero-hill)"/>
    <circle cx="468" cy="560" r="26" fill="#5E8C6A"/>
    <circle cx="492" cy="548" r="20" fill="#9DBEA6"/>
    <circle cx="742" cy="548" r="24" fill="#5E8C6A"/>
    <circle cx="722" cy="536" r="16" fill="#9DBEA6"/>
    <!-- grass cap -->
    <path d="M352 714c0-38 108-68 250-68s250 30 250 68c0 16-24 20-40 18-18 12-50 10-64 2-30 12-72 14-100 6-34 12-80 12-110 0-26 10-64 8-80-6-22 4-52 0-60-8-30 0-46-2-46-12z" fill="url(#hero-grass)"/>
  </g>

  <!-- terraced hill of books -->
  <g id="books">
    <!-- book 1: fore-edge, deep green cover -->
    <rect x="404" y="630" width="404" height="62" rx="14" fill="url(#hero-grass)"/>
    <rect x="426" y="641" width="374" height="40" rx="6" fill="url(#hero-page)"/>
    <path d="M436 654h356M436 667h356" stroke="#E3D3B5" stroke-width="2" stroke-linecap="round"/>
    <path d="M400 636c0-6 5-10 12-10h388c7 0 12 4 12 10 0 7-8 9-14 9-7 0-9 7-16 7s-9-6-16-6-10 8-18 8-9-8-17-8-10 6-18 6-9-6-17-6H418c-8 0-18 0-18-10z" fill="#5E8C6A"/>

    <!-- book 2: spine, champagne -->
    <rect x="414" y="576" width="352" height="56" rx="14" fill="url(#hero-champ)"/>
    <path d="M448 580v48M732 580v48" stroke="#A67F38" stroke-width="3" stroke-linecap="round"/>
    <path d="M460 580v48M720 580v48" stroke="#A67F38" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M410 582c0-6 5-10 12-10h336c7 0 12 4 12 10 0 7-8 9-14 9-6 0-8 7-15 7s-9-6-16-6-9 7-17 7-9-7-16-7-10 5-17 5-8-5-16-5H426c-8 0-16 1-16-10z" fill="url(#hero-grass)"/>

    <!-- book 3: fore-edge, coral cover -->
    <rect x="482" y="526" width="276" height="52" rx="12" fill="url(#hero-coral)"/>
    <rect x="500" y="535" width="252" height="34" rx="6" fill="url(#hero-page)"/>
    <path d="M508 546h236M508 558h236" stroke="#E3D3B5" stroke-width="2" stroke-linecap="round"/>
    <path d="M478 532c0-6 5-10 12-10h260c7 0 12 4 12 10 0 7-8 8-13 8-6 0-8 6-15 6s-8-6-15-6-9 6-16 6-9-6-16-6H494c-8 0-16 1-16-8z" fill="#5E8C6A"/>

    <!-- book 4: spine, gold, ribbon -->
    <rect x="498" y="484" width="214" height="44" rx="12" fill="url(#hero-gold)"/>
    <path d="M528 488v36M682 488v36" stroke="#FFFDF9" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M540 526v30l-8-7-8 7v-30z" fill="#3F6B4E"/>
    <path d="M494 490c0-6 5-10 12-10h198c7 0 12 4 12 10 0 6-7 8-12 8-6 0-8 6-14 6s-8-6-14-6H508c-7 0-14 0-14-8z" fill="url(#hero-grass)"/>

    <!-- terrace shrubs -->
    <circle cx="396" cy="664" r="22" fill="url(#hero-grass)"/>
    <circle cx="418" cy="676" r="15" fill="#5E8C6A"/>
    <circle cx="812" cy="668" r="18" fill="url(#hero-grass)"/>
    <circle cx="420" cy="620" r="15" fill="url(#hero-grass)"/>
    <circle cx="438" cy="626" r="9" fill="#5E8C6A"/>
    <circle cx="782" cy="617" r="14" fill="url(#hero-grass)"/>
    <circle cx="800" cy="622" r="9" fill="#5E8C6A"/>
    <circle cx="456" cy="567" r="10" fill="url(#hero-grass)"/>
    <circle cx="746" cy="519" r="8" fill="#5E8C6A"/>
    <circle cx="728" cy="516" r="12" fill="url(#hero-grass)"/>
  </g>

  <!-- study tower -->
  <g id="tower">
    <circle cx="604" cy="294" r="58" fill="#F4E3B8" filter="url(#hero-blur)"/>
    <path d="M573 482l10-150h42l10 150z" fill="url(#hero-tower)"/>
    <path d="M577 426h54l2 26h-58zM581 368h46l2 24h-50z" fill="url(#hero-champ)"/>
    <path d="M592 482v-18a12 12 0 0 1 24 0v18z" fill="#7A5A2B"/>
    <rect x="595" y="398" width="18" height="22" rx="9" fill="#F4E3B8"/>
    <rect x="559" y="322" width="90" height="14" rx="7" fill="url(#hero-gold)"/>
    <rect x="575" y="268" width="58" height="56" rx="10" fill="#FFFDF9"/>
    <rect x="585" y="277" width="38" height="40" rx="8" fill="#F4E3B8"/>
    <path d="M598 278v38M610 278v38" stroke="#C9A45C" stroke-width="2.5"/>
    <path d="M565 272c0-26 18-42 39-42s39 16 39 42z" fill="url(#hero-grass)"/>
    <path d="M581 262c3-12 10-20 20-24" stroke="#9DBEA6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="604" cy="224" r="7" fill="#C9A45C"/>
  </g>

  <!-- palms -->
  <g id="palm-left" transform="translate(350 714) scale(-0.92 0.92)">
    <path d="M-9 0C-8-70 2-140 22-205l14 4C18-140 10-70 11 0z" fill="url(#hero-trunk)"/>
    <path d="M-7-40q9 5 18 0M-5-82q9 5 18 0M0-124q9 5 17 0M8-164q8 5 16 0" stroke="#7A5A2B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M29-207c-19-38-59-55-89-43 35 6 65 22 85 50zM29-207c21-43 66-55 91-38-32 3-65 19-87 45z" fill="#3F6B4E"/>
    <path d="M29-205c-29-20-79-17-111 27 34-22 72-24 111-20zM29-205c31-23 81-17 111 25-35-22-72-24-111-18z" fill="url(#hero-grass)"/>
    <path d="M29-203c-24 3-54 23-64 53 20-25 43-40 64-48zM29-203c26 5 56 25 66 58-20-27-43-43-66-53z" fill="#5E8C6A"/>
    <circle cx="22" cy="-196" r="7" fill="#7A5A2B"/>
    <circle cx="36" cy="-194" r="7" fill="#A67F38"/>
  </g>
  <g id="palm-right" transform="translate(848 708) scale(1.12)">
    <path d="M-9 0C-8-70 2-140 22-205l14 4C18-140 10-70 11 0z" fill="url(#hero-trunk)"/>
    <path d="M-7-40q9 5 18 0M-5-82q9 5 18 0M0-124q9 5 17 0M8-164q8 5 16 0" stroke="#7A5A2B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M29-207c-19-38-59-55-89-43 35 6 65 22 85 50zM29-207c21-43 66-55 91-38-32 3-65 19-87 45z" fill="#3F6B4E"/>
    <path d="M29-205c-29-20-79-17-111 27 34-22 72-24 111-20zM29-205c31-23 81-17 111 25-35-22-72-24-111-18z" fill="url(#hero-grass)"/>
    <path d="M29-203c-24 3-54 23-64 53 20-25 43-40 64-48zM29-203c26 5 56 25 66 58-20-27-43-43-66-53z" fill="#5E8C6A"/>
    <circle cx="22" cy="-196" r="7" fill="#7A5A2B"/>
    <circle cx="36" cy="-194" r="7" fill="#A67F38"/>
  </g>

  <!-- sailboat -->
  <g id="boat">
    <ellipse cx="992" cy="818" rx="50" ry="7" fill="#3A3024" opacity="0.1"/>
    <path d="M944 798h96c-6 15-22 22-46 22s-42-7-50-22z" fill="url(#hero-trunk)"/>
    <path d="M994 710v88" stroke="#7A5A2B" stroke-width="3" stroke-linecap="round"/>
    <path d="M999 716c22 18 34 44 34 76h-34z" fill="#FFFDF9"/>
    <path d="M989 728c-16 16-28 36-30 64h30z" fill="url(#hero-champ)"/>
    <path d="M994 710l16 6-16 6z" fill="#E39B7B"/>
  </g>

  <!-- foreground details -->
  <g id="foreground">
    <ellipse cx="322" cy="772" rx="22" ry="12" fill="url(#hero-champ)"/>
    <ellipse cx="348" cy="780" rx="12" ry="7" fill="#E3D3B5"/>
    <path d="M880 756c2-12 6-20 12-26M888 758c0-10 2-16 6-20M896 758c2-8 6-12 10-14" stroke="#5E8C6A" stroke-width="3" stroke-linecap="round"/>
    <path d="M760 300l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#D9BE8C"/>
    <path d="M1030 420l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#D9BE8C"/>
    <path d="M186 560l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#D9BE8C"/>
  </g>
</svg>
