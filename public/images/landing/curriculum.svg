    <path d="M140 262q1.1 5.9 7 7q-5.9 1.1-7 7q-1.1-5.9-7-7q5.9-1.1 7-7z" fill="#D9BE8C"/>
    <path d="M604 108q.9 5.1 6 6q-5.1.9-6 6q-.9-5.1-6-6q5.1-.9 6-6z" fill="#D9BE8C"/>
  </g>

  <g id="ground">
