    <linearGradient id="curriculum-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9A45C"/><stop offset="1" stop-color="#A67F38"/></linearGradient>
    <linearGradient id="curriculum-sage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9DBEA6"/><stop offset="1" stop-color="#5E8C6A"/></linearGradient>
    <linearGradient id="curriculum-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E8C6A"/><stop offset="1" stop-color="#3F6B4E"/></linearGradient>
    <linearGradient id="curriculum-champ" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9BE8C"/><stop offset="1" stop-color="#C9A45C"/></linearGradient>
